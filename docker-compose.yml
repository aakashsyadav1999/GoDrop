services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: godrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: godrop
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godrop -d godrop"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    image: godrop-server:latest
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      GODROP_ADDR: ":8080"
      GODROP_WORKERS: "5"
      GODROP_QUEUE: "100"
      GODROP_JOB_TIMEOUT: "10s"
      GODROP_REDIS_ADDR: "redis:6379"
      GODROP_POSTGRES_DSN: "postgres://godrop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/godrop?sslmode=disable"
      GODROP_LOG_FORMAT: "json"
      GODROP_RATE_LIMIT: "10"
      GODROP_RATE_BURST: "20"
      # Caddy is the only way in, and it sets X-Forwarded-For, so this is safe to trust.
      GODROP_TRUST_PROXY: "true"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  caddy-data:
  caddy-config:
